apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-gateway
  labels: { app: auth-gateway }
spec:
  replicas: 1
  selector:
    matchLabels: { app: auth-gateway }
  template:
    metadata:
      labels: { app: auth-gateway }
    spec:
      containers:
        - name: app
          image: nginx
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { memory: 64Mi }
