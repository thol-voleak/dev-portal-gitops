apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Locally every environment is a namespace in one cluster; in real use each env is its own cluster.
namespace: auth-sit
resources:
  - ../../base
images:
  # Updated by Dev Portal release management
  - name: nginx
    newTag: 1.27.4-alpine
replicas:
  - name: auth-gateway
    count: 1
