apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-svc
  labels: { app: notification-svc }
spec:
  replicas: 1
  selector:
    matchLabels: { app: notification-svc }
  template:
    metadata:
      labels: { app: notification-svc }
    spec:
      containers:
        - name: app
          image: traefik/whoami
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { memory: 64Mi }
